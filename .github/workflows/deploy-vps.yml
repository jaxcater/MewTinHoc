name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.188.238
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /www/wwwroot/mewtinhoc
            git config --global --add safe.directory /www/wwwroot/mewtinhoc
            git pull --ff-only origin main
            export PATH=/www/server/nodejs/v22.22.1/bin:$PATH
            export NODE_ENV=production
            npm ci
            npm run build
            pm2 restart mewtinhoc --update-env
            git log -1 --oneline
            test -f dist/index.html
            echo "Deploy completed at $(date)" >> /tmp/deploy.log
