name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.188.238
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /www/wwwroot/mewtinhoc
            git pull origin main
            export PATH=/www/server/nodejs/v22.22.1/bin:$PATH
            npm install
            npm run build
            pm2 restart mewtinhoc
            echo "Deploy completed at $(date)" >> /tmp/deploy.log
